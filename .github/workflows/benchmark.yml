name: Run benchmarks

on:
  workflow_call:
    inputs:
      benchmarks:
        description: "paths to benchmarks, JSON array format"
        type: string
        required: true

jobs:
  run-benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    if: ${{ github.event.inputs.benchmarks == '' }}
    strategy:
      fail-fast: false
      matrix:
        path: ${{ fromJSON(inputs.benchmarks) }}
  
    env:
      cache: true
      ARTIFACTS_FOLDER: artifacts

    defaults:
      run:
        shell: bash
        working-directory: benchmarks/${{ matrix.path }}

    steps:
      - uses: actions/checkout@v3

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - uses: actions/cache@v3
        if: env.cache
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/home/linuxbrew/
            **/target/release/*
            **/examples/*
            **/built/local/*
            **/Cargo.toml
          key: ${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'run.sh') }}

      - uses: kaleidawave/release-downloader@improvements
        with: { 'items': 'sharkdp/hyperfine@v1.19.0' }
        env:
          GH_TOKEN: ${{ github.token }}

      # - run: mkdir -p ${{ env.ARTIFACTS_FOLDER }}

      - name: Make executables executable
        run: |
          # run.sh and setup.sh might not be executable
          chmod +x run.sh
          chmod +x setup.sh

      - name: Run setup
        run: ./setup.sh
        env:
          # May use GH to download assets
          GH_TOKEN: ${{ github.token }}

      - name: Run benchmark
        run: ./run.sh

      # - name: Upload artifacts
      #   uses: actions/upload-artifact@v3
      #   with:
      #     name: artifacts-${{ matrix.path }}
      #     path: benchmarks/${{ matrix.path }}/${{ env.ARTIFACTS_FOLDER }}
